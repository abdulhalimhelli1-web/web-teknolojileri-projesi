<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Web Projem - İletişim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Vue.js 3 Kütüphanesi -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="d-flex flex-column min-vh-100"> 

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">Web Projem</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Hakkında</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item"><a class="nav-link" href="city.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="heritage.html">Mirasımız</a></li>
                    <li class="nav-item"><a class="nav-link" href="interests.html">İlgi Alanlarım</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">İletişim</a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="login.html">Giriş Yap</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5 mb-5 flex-grow-1" id="vue-app">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h2 class="mb-0">Benimle İletişime Geçin</h2>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- FORM BAŞLANGICI: Veriler process_contact.php'ye POST edilecek -->
                        <form id="contactForm" ref="myForm" action="process_contact.php" method="POST">
                            
                            <!-- Text Input -->
                            <div class="mb-3">
                                <label for="isim" class="form-label">Adınız Soyadınız (*)</label>
                                <input type="text" class="form-control" id="isim" name="fullname" v-model="isim" placeholder="Ad Soyad giriniz">
                            </div>

                            <!-- Email Input -->
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail Adresiniz (*)</label>
                                <input type="text" class="form-control" id="email" name="email" v-model="email" placeholder="ornek@mail.com">
                            </div>

                            <!-- Tel Input -->
                            <div class="mb-3">
                                <label for="telefon" class="form-label">Telefon Numaranız (* Sadece Rakam)</label>
                                <input type="text" class="form-control" id="telefon" name="phone" v-model="telefon" placeholder="05551234567">
                            </div>

                            <!-- Select (Açılır Menü) -->
                            <div class="mb-3">
                                <label for="konu" class="form-label">İletişim Konusu</label>
                                <select class="form-select" id="konu" name="subject">
                                    <option value="İş Teklifi">İş Teklifi</option>
                                    <option value="Proje Sorusu">Proje Sorusu</option>
                                    <option value="Diğer">Diğer</option>
                                </select>
                            </div>

                            <!-- Radio Button -->
                            <div class="mb-3">
                                <label class="form-label d-block">Cinsiyetiniz</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="erkek" value="Erkek" checked>
                                    <label class="form-check-label" for="erkek">Erkek</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="kadin" value="Kadın">
                                    <label class="form-check-label" for="kadin">Kadın</label>
                                </div>
                            </div>

                            <!-- Textarea -->
                            <div class="mb-4">
                                <label for="mesaj" class="form-label">Mesajınız</label>
                                <textarea class="form-control" id="mesaj" name="message" rows="4" placeholder="Mesajınızı buraya yazın..."></textarea>
                            </div>

                            <!-- Checkbox -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="onay" name="terms" value="Kabul Edildi">
                                <label class="form-check-label" for="onay">Verilerimin işlenmesini kabul ediyorum.</label>
                            </div>

                            <!-- PDF KURALI: İKİ FARKLI BUTON -->
                            <div class="d-grid gap-3 d-md-flex justify-content-md-center">
                                <!-- 1. BUTON: NATIVE JS -->
                                <button type="button" class="btn btn-primary px-4 py-2" onclick="validateNativeJS(event)">
                                    Gönder (Native JS)
                                </button>
                                
                                <!-- 2. BUTON: VUE.JS -->
                                <button type="button" class="btn btn-warning px-4 py-2 text-dark fw-bold" @click="validateVueJS">
                                    Gönder (Vue.js)
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Web Teknolojileri Projesi - Abdulhalim Helli</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
